<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<title>Clipper Studio · sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=5">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .gate { width: min(380px, 100%); }
  .gate .brand { padding: 0 0 28px; font-size: 24px; }
  .gate h1 { font-size: 26px; margin-bottom: 6px; }
  .gate form { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
  .gate input { min-height: 52px; font-size: 17px; letter-spacing: .08em; }
  .gate .err { color: var(--bad); font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<div class="gate">
  <div class="brand"><i></i>Clipper <small>studio</small></div>
  <h1>Enter the passcode</h1>
  <p class="hint">The owner of this studio gave it to you. It keeps you signed in on this phone for 30 days.</p>
  <form id="f">
    <input id="p" type="password" autocomplete="current-password" placeholder="Passcode" required autofocus>
    <button class="btn go big">Open the studio</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ passcode: document.getElementById("p").value }) });
  if (r.ok) return (location.href = "/");
  const d = await r.json().catch(() => ({}));
  document.getElementById("err").textContent = d.detail || "That didn't work";
  document.getElementById("p").select();
});
</script>
</body>
</html>
